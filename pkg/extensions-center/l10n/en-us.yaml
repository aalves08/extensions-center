  bundleAnalysis:
    title: Bundle Analysis
    description: >-
      What each official extension actually ships, read from the built assets
      published on its gh-pages branch.
    empty: No data. Press Refresh to run the analysis.
    notBuilt: >-
      This analysis has not been run yet. Press Refresh to read the published
      bundles. The result is saved, so later visits load it without
      re-downloading.
    refreshCost: >-
      Downloads up to 98 MB of source maps from gh-pages. Takes several minutes.
    sourceNote: >-
      Bundle size is total minified JS across all code-split chunks. The
      breakdown figures come from source maps, which record pre-minification
      bytes, so each is scaled to disk by its own bundle's source-to-disk
      ratio — that way a breakdown adds up to the bundle beside it rather than
      to two or three times it.
    sourceSizeHint: >-
      Pre-minification bytes, merged across every chunk.
    notPublished: Not published
    pluginDir: Plugin directory
    sourceMaps: Source maps
    selectExtension: Extension
    noLeaks: No extension is bundling code the host already provides.
    leaksDescription: >-
      @rancher/shell and @rancher/components are provided by the host at
      runtime and must be externalized. Anything listed here is shipping a
      second copy of code that is already loaded.
    tabs:
      overview: Overview
      cause: By Cause
      leaks: Externalization
      perExtension: Extension Detail
    summary:
      published: Published bundles
      totalBytes: Total shipped JS
      largest: Largest bundle
      leaking: Extensions with leaks
      shellCaused: Shell-caused weight
    detail:
      chunks: Chunks
      byCause: Why it is in the bundle
      byCategory: By category
      byPackage: By package
      leaked: Should have been external
    warn:
      shell: >-
        @rancher/shell is bundled — {count} file(s). The host provides it at
        runtime, so this is a second copy.
      components: >-
        @rancher/components is bundled — {count} file(s). The host provides it
        at runtime, so this is a second copy.
      host: 'Host-provided packages found in the bundle: {pkgs}'
    category:
      shell: '@rancher/shell (should be external)'
      components: '@rancher/components (should be external)'
      host-provided: Host-provided (should be external)
      extension-code: Extension own code
      external-lib: Bundled external library
      externalized: Externalized
      webpack-runtime: Webpack runtime
    # Why a package is in the bundle, as opposed to where its files came from.
    # The first six are shell's to fix without any extension author touching
    # their code, which is the whole reason the axis exists.
    cause:
      shell-code: Shell code bundled
      shell-dep: Shell dependency
      shell-dep-transitive: Shell dependency (transitive)
      node-polyfill: Node polyfill
      build-tooling: Build tooling
      already-external: Stale build (now externalized)
      extension-code: Extension own code
      extension-dep: Extension dependency
      generated: Generated
      webpack-runtime: Webpack runtime
      externalized: Externalized
    causeFix:
      shell-code: Externalize @rancher/shell in the library build.
      shell-dep: >-
        Externalize it, or cut the shell import that drags it in. Either way the
        fix is in rancher/dashboard, not here.
      shell-dep-transitive: Follows its parent; fixing the parent clears it.
      node-polyfill: >-
        Drop NodePolyfillPlugin from library builds. It injects Buffer, process
        and console into every extension whether or not anything asked.
      build-tooling: >-
        Build-time code that cannot run in a browser. Keep it out of the module
        graph.
      already-external: >-
        Shell already externalizes this. Rebuilding against a current shell
        removes it.
      extension-code: Not shell's to fix.
      extension-dep: Not shell's to fix.
      generated: Generated by the build. Expected.
      webpack-runtime: Module plumbing. Expected.
      externalized: Recorded but not bundled. This is the good outcome.
    causeDescription: >-
      Categories say where a file came from; causes say who put it there, which
      is the version that maps onto an owner and a change. Everything above the
      rule is recoverable in rancher/dashboard alone.
    shellCaused: Shell-caused
    diskNote: >-
      Sizes are source bytes scaled to disk by this bundle's own
      source-to-disk ratio, so they add up to the shipped size rather than to
      two or three times it. The ratio is measured per bundle: across the
      published extensions it runs from 0.30 to 0.66, so one shared figure
      would be wrong for almost all of them.
    noRatio: >-
      This bundle's source maps carried no content, so source bytes could not
      be scaled to disk. Sizes below are pre-minification and not comparable
      with the shipped size.
    tabsCause: By cause
    cols:
      extension: Extension
      version: Version
      chunks: Chunks
      chunk: Chunk
      bundleSize: Bundle size
      size: Size
      ownCode: Own code
      externalLibs: External libs
      shellLeak: Shell bundled?
      componentsLeak: Components bundled?
      category: Category
      cause: Cause
      fix: Fix
      package: Package
      packages: Packages
      sourceSize: Source size
      shippedSize: Shipped size
      shellCaused: Shell-caused
      ratio: Ratio
      resolved: Resolved version
      files: Files

