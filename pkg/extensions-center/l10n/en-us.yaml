      Dependabot records against each alert, and public dependency data carries
      no such dates — it describes the tree as it stands today and nothing more.

    severity:
      critical: Critical
      high: High
      medium: Medium
      low: Low
      unknown: Unknown

    scope:
      runtime: Runtime
      development: Development
      mixed: Mixed

    relationship:
      direct: Direct
      transitive: Transitive

    source:
      dependabot: Dependabot
      public: Public data

    view:
      list: List
      chart: Over time

    range:
      label: Range
      90: 3 months
      182: 6 months
      365: 1 year
