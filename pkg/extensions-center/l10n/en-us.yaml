extensionsCenter:
  product:
    label: Extensions Center

  nav:
    dashboard: Dashboard
    workflowTests: Workflow Tests
    compatTests: Compatibility Tests
    knownRepos: Known Extensions
    npmMetrics: NPM Metrics
    settings: Settings

  common:
    refresh: Refresh
    refreshing: Refreshing…
    lastRefreshed: 'Last refreshed: {value}'
    neverRefreshed: Not refreshed yet
    viewAll: View all
    openInGitHub: Open in GitHub
    na: —
    loadFailed: Could not load this data.
    retry: Try again
    unknown: Unknown

  errors:
    proxyFailed: >-
      This request is proxied through Rancher because GitHub code search cannot
      be called from a browser. If it keeps failing, a cluster administrator may
      need to allow api.github.com on the Rancher proxy by creating a
      ProxyEndpoint for it.

  status:
    success: Passed
    failure: Failed
    cancelled: Cancelled
    skipped: Skipped
    in_progress: Running
    queued: Queued
    unknown: Unknown

  dashboard:
    title: Extensions Center
    subtitle: Everything Rancher extensions related, in one place.
    configMissing:
      title: GitHub credentials not configured
      message: >-
        Without a GitHub token this dashboard is limited to 60 unauthenticated API
        requests per hour and will mostly fail to load. Add a token on the Settings page.
      action: Go to Settings
    proxyForbidden: >-
      GitHub code search has to be proxied through Rancher, which needs a
      cluster-scoped ProxyEndpoint for api.github.com. You do not have
      permission to create one, so rebuilding the known extensions list will
      fail until a cluster administrator adds it.
    proxyError: 'Could not set up the Rancher proxy for api.github.com: {message}'

  workflowTests:
    title: Workflow Test Runs
    listTitle: Extension Workflow Test Runs
    description: >-
      Nightly runs of test-extension-workflows-master.yml in rancher/dashboard.
    empty: No workflow test runs found.
    detailTitle: 'Workflow test run #{runNumber}'

  compatTests:
    title: Compatibility Test Runs
    listTitle: Extension Compatibility Test Runs
    description: Runs of the extension compatibility test suite in rancher/dashboard.
    empty: No compatibility test runs found.
    detailTitle: 'Compatibility test run #{runNumber}'

  runs:
    cols:
      runId: Run ID
      link: GitHub
      status: Status
      overallStatus: Overall Status
      total: Tests
      passed: Passed
      skipped: Skipped
      failed: Failed
      branch: Branch
      event: Trigger
      actor: Actor
      started: Started
      duration: Duration
    detail:
      overview: Overview
      jobs: Jobs
      workflow: Workflow
      commit: Commit
      commitMessage: Commit Message
      attempt: Attempt
      triggeringActor: Triggering Actor
      sha: Commit SHA
      jobName: Job
      jobStatus: Status
      jobDuration: Duration
      steps: Steps
      stepName: Step
      stepStatus: Status
      stepDuration: Duration
      noJobs: This run reported no jobs.
      noSteps: This job ran no steps.

  officialRepos:
    title: Official Extension Repos
    description: Repos listed in the rancher/ui-plugin-charts manifest.
    empty: No official extension repos found.
    cols:
      name: Extension
      headBranch: Head Branch
      shellVersion: '@rancher/shell'
      componentsVersion: '@rancher/components'
      publishedVersion: Published (gh-pages)
      latestOfficial: Latest Official
    outOfSync: >-
      {published} is published on the extension's gh-pages branch, but the
      official charts still carry {official}.

  knownRepos:
    title: Known Extensions
    listTitle: All Known Extensions
    description: >-
      Community and official Rancher extension repos, ranked by popularity.
      The dashboard shows the top {count} community repos; the full list includes official ones.
    empty: No known extension repos found.
    refreshCost: Rebuilds from a full GitHub scan
    notBuilt: >-
      This list has not been built yet. Press Refresh to scan GitHub for
      extension repositories. The result is saved, so later visits load it
      without re-scanning.
    stale: >-
      This list is over a month old. Press Refresh to rebuild it when you want
      current data.
    cols:
      name: Name
      repo: Repository
      description: Description
      category: Category
    external: External
    suse: SUSE
    summary:
      title: Category Summary
      total: Total extensions
      category: Category
      count: Count

  npmMetrics:
    title: NPM Metrics
    description: Download and release activity for the packages extensions build against.
    latestVersion: Latest version
    published: Published
    totalVersions: Versions published
    lastWeek: Downloads (last week)
    lastMonth: Downloads (last month)
    chartTitle: Daily downloads
    range:
      label: Range
      lastMonth: Last 30 days
      lastQuarter: Last 90 days
      lastYear: Last 12 months

  links:
    title: Important Links
    description: Extensions documentation in Confluence.

  actions:
    title: Actions
    refreshAll: Refresh all data
    openSettings: Open Settings
    openDocs: Extensions dev docs

  settings:
    title: Settings
    description: >-
      Credentials are stored in the {secret} Secret in the {namespace} namespace.
      They are never displayed again once saved.
    githubToken:
      label: GitHub Personal Access Token
      placeholder: ghp_…
      tooltip: >-
        Needs public_repo (or repo for private repos) plus read:org. Used for all
        GitHub API calls so the dashboard is not rate limited.
    provider:
      sectionTitle: Claude Provider
      sectionHint: >-
        Optional, and nothing calls it yet. The layer that generated
        descriptions and categories for community extension repos has been
        taken out for now; these credentials are kept for when it returns.
      label: Provider
      tooltip: >-
        Credentials are kept per provider, so switching back and forth does not
        make you re-enter them.
      options:
        anthropic: Anthropic API
        claudeAws: Claude Platform on AWS
        bedrock: Amazon Bedrock
    anthropicKey:
      label: Anthropic API Key
      placeholder: sk-ant-…
      tooltip: >-
        Create one at console.anthropic.com. The key is sent straight from your
        browser to the Anthropic API.
    aws:
      accessKeyId:
        label: AWS Access Key ID
        placeholder: AKIA…
      secretAccessKey:
        label: AWS Secret Access Key
      sessionToken:
        label: AWS Session Token
        tooltip: >-
          Only needed for temporary credentials, such as those from AWS STS or
          an assumed role.
      region:
        label: AWS Region
        tooltip: >-
          The Bedrock region the model is enabled in. The model must be enabled
          for your account before it can be called.
    claudeAws:
      apiKey:
        label: Workspace API Key
        tooltip: >-
          Create one in the AWS console under Claude Platform on AWS, then API
          keys. An Amazon Bedrock key will not work here — the two are separate
          services with separate endpoints and separate keys.
      workspaceId:
        label: Workspace ID
        placeholder: wrkspc_…
        tooltip: >-
          Required on every call and not derivable from the key. Find it under
          Workspaces on the Claude Platform on AWS console page.
      region:
        label: AWS Region
        tooltip: >-
          Part of the endpoint hostname, so it has to be a region your account
          is set up in. There is no default — unlike Bedrock, this one does not
          guess.
    model:
      label: Model Override
      tooltip: >-
        Leave blank to use the default shown. Anthropic and Claude Platform on
        AWS share the same model IDs; Bedrock has its own naming.
    configured: Configured
    notConfigured: Not configured
    save: Save
    saving: Saving…
    saved: Credentials saved.
    clear: Clear
    cleared: Credentials cleared.
    saveFailed: 'Could not save credentials: {message}'
    permissionDenied: >-
      You do not have permission to manage Secrets in the {namespace} namespace.
      Ask a cluster administrator to configure this extension.
    leaveBlank: Leave blank to keep the current value.
