      days: '{count} days'
      months: '{count} months'
      years: '{count} years'

    summary:
      severityTitle: Open advisories
      remediationTitle: Remediation

    tiles:
      unpatched: No patch available
      oldest: Oldest open

    filters:
      all: All
      severity: Severity
      scope: Scope
      patch: Patch
      hasPatch: Has a patch
      noPatch: No patch available

    cols:
      package: Package
      severity: Severity
      advisories: Advisories
      manifests: Manifests
      patched: Patched in
      scope: Scope
      oldest: Oldest
      repo: Repository
      source: Source
      vulnerabilities: Vulnerabilities
      total: Total
      reach: Ships?
      inBundles: In bundles
      shippedBytes: Shipped size
      flaggedBy: Flagged by

    manifestCount: '{count} manifests'

    reach:
      tab: By package
      explain: >-
        Every other tab is organised by repository, which is how the advisories
        arrive and not how the risk is spread. This one crosses the vulnerable
        packages against what the published bundles on gh-pages actually
        contain, so a package appears once and is ranked by whether it reaches
        a browser. Most of what a lockfile flags never ships — build tooling,
        test harnesses, dependencies that tree-shaking removed — and those are
        hygiene, not exposure.
      empty: Nothing vulnerable was found in any published bundle.
      noBundles: >-
        Bundle analysis has never been run, so there is nothing to cross these
        advisories against. Run it from the Bundle Analysis page first.
      noRepos: >-
        No repositories have been read yet. Open a repo tab, or load the whole
        estate from the All repos tab, and the packages will appear here.
      scope: 'Across {repos} repos and {bundles} analysed bundles'
      notShippedNote: >-
        This package is in no published bundle. Still worth fixing, but it is
        not something a user downloads.
      resolved: 'Resolved: {value}'
      noLockfile: No lockfile read
      stats:
        confirmed: ship a vulnerable version
        unconfirmed: ship, version unconfirmed
        notShipped: do not ship
      verdict:
        # Not severities. These say how confidently the shipped version was
        # matched against an advisory's range, which is a separate axis.
        hit: Ships
        partial: Ships (one of several)
        unknown: Ships, unconfirmed
        miss: Not shipped

    detail:
      # Sentence forms, used where the field sits inline in a list
      range: 'Vulnerable: {value}'
      patched: 'Fixed in: {value}'
      # Bare labels, used where the field sits in the expanded advisory's grid
      vulnerable: Vulnerable
      manifest: Manifest
      relationship: Dependency
      scope: Scope
      reported: Reported
      fixedIn: 'Fixed in {value}'
      noFix: No patch available
      ghsaLink: 'View {value} on GitHub'
      cveLink: 'View {value} in the National Vulnerability Database'

    publicSource:
      title: 'Source: public data, not Dependabot'
      detail: >-
        The configured GitHub token cannot read the Dependabot alerts for this
        repo, so these rows come from its public dependency graph matched
        against the OSV advisory database. That means no dismissals are
        honoured, nothing is deduplicated the way Dependabot does it, and there
        is no runtime versus development split — so these counts run higher and
        are not comparable with the counts on a Dependabot repo. Advisories
        that carry no severity rating at all are counted as Unknown rather than
        being graded down to Low.
      unresolved: >-
        {count} dependencies were declared as a version range the dependency
        graph never resolved. They are excluded rather than guessed at.

    rollup:
      explain: >-
        The estate view reads all {count} repos, which takes around a minute and
        a few hundred requests. Individual tabs are much cheaper, so this one is
        on request rather than automatic.
      load: Load all security data
      loading: Loading…
      dependabot: From Dependabot
      publicData: From public data
      repoCount: '{count} repos'
      failed: 'Could not read: {repos}'

    scopeNote:
      shell: >-
        This package lives in rancher/dashboard rather than a repo of its own.
        Dependabot records the lockfile each alert was raised against, and
        shell has one, so these rows are the alerts filed against
        shell/yarn.lock and nothing else in the monorepo.
      components: >-
        This package lives in rancher/dashboard and no longer has a lockfile of
        its own, so its transitive dependencies resolve through the workspace
        root and Dependabot files them against the root yarn.lock along with
        the whole monorepo. These rows are everything filed against
        pkg/rancher-components, plus the root lockfile alerts for packages that
        its package.json declares under dependencies or peerDependencies. That
        covers its direct dependencies; anything transitive pulled in since the
        lockfile was removed cannot be told apart from the rest of the
        monorepo, so treat this as a floor rather than a complete picture.
