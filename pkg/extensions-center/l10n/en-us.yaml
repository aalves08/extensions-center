  importAnalysis:
    title: Import Analysis
    description: >-
      What each official extension imports from @rancher/shell and
      @rancher/components, read from its source at the latest released tag.
    empty: No data. Press Refresh to run the analysis.
    notBuilt: >-
      This analysis has not been run yet. Press Refresh to scan the official
      extensions. The result is saved, so later visits load it without
      re-scanning.
    refreshCost: >-
      Scans every official extension repo and downloads around 1,150 source
      files. Takes 30–90 seconds.
    sourceNote: 'Module sizes resolved against {ref}.'
    selectExtension: Extension
    unresolvedHint: >-
      This path does not resolve to a file in rancher/dashboard, so its size is
      unknown.
    unresolvedDescription: >-
      Shell paths that no longer resolve to a file in rancher/dashboard. Each is
      either a stale import, a path that was renamed, or something private that
      was never part of the public API.
    surfaceDescription: >-
      Shell marks nothing as public or private, so every path below is API that
      has to keep working. These are grouped by how exposed each one is to shell
      changing underneath it — expand a row to see the exact symbols that would
      break.
    noRisky: >-
      No extension imports a private or internal shell path. Every import is
      against a module path shell can reasonably be expected to keep.
    exposureTitle: Exposure by extension
    pathsTitle: Paths
    showAllPaths: 'Show all {count} shell paths, not just the ones needing attention'
    risk:
      private: Private
      internal: Internal
      file-suffix: File path
      ok: OK
    riskNote:
      private: >-
        Reaches into shell's own screens or startup code, which carry no
        stability guarantee and can be moved or deleted in any release without
        anything warning the extension.
      internal: >-
        Depends on shell's internal wiring — its store, mixins or resource
        models — rather than on a contract meant for consumers.
      file-suffix: >-
        Imports a concrete file rather than a module path, so it pins the file
        extension. Converting that file from .js to .ts inside shell breaks this
        import, even though nothing about its behaviour changed.
      ok: >-
        A plain module path with no obvious problem. It is still unversioned
        API, but it is the kind a supported surface would most likely keep.
